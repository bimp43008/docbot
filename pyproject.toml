[project]
name = "docbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "bimp43008", email = "339244299+bimp43008@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.16.0",
    "langchain>=1.5.0",
    "langchain-community>=0.4.2",
    "langchain-huggingface>=1.2.3",
    "openai>=3.49",
    "pydantic-settings>=2.16.2",
    "sentence-transformers>=6.3.0",
]

[project.scripts]
docbot = "docbot:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
