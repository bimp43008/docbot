services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: docbot
      POSTGRES_PASSWORD: docbot
      POSTGRES_DB: docbot
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  n8n:
    image: n8nio/n8n
    ports: ["5678:5678"]
    environment:
      N8N_SECURE_COOKIE: "false"
    volumes:
      - n8n_data:/home/node/.n8n
volumes:
  pgdata:
  n8n_data: